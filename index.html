<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rehabilitación de Fachadas y SATE desde 1997 | Construcciones BZ</title>
    <meta name="description" content="Empresa especialista en rehabilitación de fachadas, aislamiento SATE, humedades, grietas y comunidades en Barcelona, Tarragona, Segur de Calafell y Baix Penedès desde 1997. +60 proyectos. Presupuesto gratis.">
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #2563eb;
            --accent: #25d366;
            --dark: #0f172a;
            --light: #f8fafc;
            --text: #334155;
            --warning-bg: #fef3c7;
            --warning-border: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.7;
            color: var(--text);
            background-color: var(--light);
            padding-bottom: 70px;
        }
        .top-bar {
            background: var(--dark);
            color: white;
            padding: 0.6rem 1rem;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .top-bar span { color: #4ade80; }
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            text-align: center;
            padding: 5rem 1rem 4rem 1rem;
        }
        header h1 {
            font-size: 2.6rem;
            margin-bottom: 1.2rem;
            max-width: 950px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.2;
        }
        header p {
            font-size: 1.25rem;
            opacity: 0.95;
            max-width: 800px;
            margin: 0 auto 2.5rem auto;
        }
        .whatsapp-btn {
            display: inline-block;
            background-color: var(--accent);
            color: white;
            font-weight: bold;
            text-decoration: none;
            padding: 1.2rem 2.5rem;
            border-radius: 50px;
            font-size: 1.25rem;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .whatsapp-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.6);
        }
        .container {
            max-width: 1000px;
            margin: -3rem auto 3rem auto;
            padding: 0 1rem;
            position: relative;
        }
        .card-commercial {
            background: white;
            padding: 3.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            margin-bottom: 2rem;
        }
        .alert-box {
            background-color: var(--warning-bg);
            border-left: 6px solid var(--warning-border);
            padding: 1.8rem;
            border-radius: 6px;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
            color: #92400e;
            font-weight: 500;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2.5rem 0;
            text-align: center;
        }
        .stat-box {
            background: #f1f5f9;
            padding: 1.5rem;
            border-radius: 8px;
            border-top: 4px solid var(--secondary);
        }
        .stat-box h3 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 0.2rem;
        }
        .stat-box p {
            font-size: 0.95rem;
            margin-bottom: 0;
            color: #475569;
            font-weight: bold;
        }
        h2 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 1.2rem;
            margin-top: 3rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }
        h2:first-of-type { margin-top: 0; }
        h3 {
            color: var(--dark);
            font-size: 1.4rem;
            margin-top: 2.2rem;
            margin-bottom: 0.8rem;
        }
        p { margin-bottom: 1.3rem; }
        ul, ol {
            padding-left: 1.5rem;
            margin-bottom: 1.5rem;
        }
        li {
            margin-bottom: 0.8rem;
        }
        .client-types {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin: 2.5rem 0;
        }
        .client-box {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 2.5rem;
            border-radius: 10px;
            transition: border-color 0.2s;
        }
        .client-box:hover {
            border-color: var(--secondary);
        }
        .client-box h3 { color: var(--primary); margin-top: 0; }
        .zones-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }
        .zone-item {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 1rem;
            text-align: center;
            border-radius: 6px;
            font-weight: 500;
            color: var(--primary);
        }
        .faq-item {
            background: #f8fafc;
            border-left: 4px solid var(--secondary);
            padding: 1.5rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
        }
        .faq-item h4 {
            color: var(--primary);
            font-size: 1.15rem;
            margin-bottom: 0.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
        }
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #f1f5f9;
            color: var(--primary);
            font-size: 1.05rem;
        }
        .cta-final {
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            border: 3px solid var(--secondary);
            padding: 3.5rem 2rem;
            border-radius: 12px;
            text-align: center;
            margin-top: 3.5rem;
        }
        .cta-final h2 { border: none; color: var(--primary); margin-top: 0; }
        .trust-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            margin: 2rem 0;
            font-weight: bold;
            color: var(--dark);
        }
        .trust-list li::before {
            content: "✔ ";
            color: #16a34a;
        }
        .floating-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.15);
            padding: 0.8rem 1rem;
            z-index: 1000;
            text-align: center;
        }
        .floating-bar a {
            background-color: var(--accent);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
        }
        @media (max-width: 768px) {
            .floating-bar { display: block; }
        }
        footer {
            text-align: center;
            padding: 3.5rem 1rem;
            background: var(--dark);
            color: white;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
